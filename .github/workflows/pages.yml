name: Publish the preview

# GitHub Pages can only serve flat files, so this publishes a snapshot: the
# schedule as attendees see it, plus a demo of the admin console, the big
# screen and the report, rendered from invented data. Nothing on it writes
# anywhere.
#
# See scripts/build-static-preview.ts for how the pages are produced.

on:
  push:
    # Only main: GitHub Pages only accepts deploys from main. Each finished
    # step is fast-forwarded onto main, which publishes it.
    branches: [main]
  # So you can publish by hand from the Actions tab, including from a phone.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running publish finish rather than cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The build never reads or writes this, but the Prisma client expects
      # to find a value when it is loaded.
      DATABASE_URL: file:./prisma/dev.db
      # Must match the repository name, since Pages serves from a sub-path.
      PREVIEW_BASE_PATH: /event-portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The data adapter imports both Prisma clients (SQLite and Postgres), so
      # they have to exist even
      # though the preview pages never read from the database.
      - run: npm run db:generate

      - name: Check it before publishing it
        run: |
          npm run typecheck
          npm run lint
          npm run test

      - name: Build the static preview
        run: npm run preview:static

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
