# Firebase App Hosting settings for the hosted portal.
# Step by step setup: docs/DEPLOYING.md.
#
# Nothing secret is written here. The secrets are stored in Google Cloud
# Secret Manager and only their names appear below. docs/DEPLOYING.md says
# where each value comes from.

runConfig:
  # 0 costs nothing when idle, but the first visitor after a quiet spell
  # waits a few seconds. Set it to 1 for the three event days, then back.
  minInstances: 0
  # Room for 100 phones scanning the welcome QR at once. Extra copies only
  # start (and cost) when the load needs them.
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  # The hosted store: Postgres (a free Neon database).
  - variable: DATA_ADAPTER
    value: postgres
    availability: [RUNTIME]
  # Up to 10 database connections per server, so a page that reads many
  # things at once (the leaderboard) never queues. Neon's pooled address
  # takes many more than that.
  - variable: PG_POOL_MAX
    value: '10'
    availability: [RUNTIME]

  - variable: EVENT_CONFIG_PATH
    value: config/event.json
    availability: [RUNTIME]

  # Neon Postgres. The pooled string for the app's queries, and the direct
  # one for creating the tables on first start.
  - variable: DATABASE_URL
    secret: portal-database-url
    availability: [RUNTIME]
  - variable: DATABASE_URL_UNPOOLED
    secret: portal-database-url-unpooled
    availability: [RUNTIME]

  # Neon Object Storage for the photo wall: OFF for now, so photos are kept
  # in Postgres (a few MB for the whole event, well inside Neon's free
  # storage). To move new photos to the "assets" bucket from neon.ts, save
  # the three secrets (docs/DEPLOYING.md, "Optional: the photo bucket") and
  # remove the # in front of these lines.
  # - variable: AWS_ACCESS_KEY_ID
  #   secret: portal-s3-access-key-id
  #   availability: [RUNTIME]
  # - variable: AWS_SECRET_ACCESS_KEY
  #   secret: portal-s3-secret-access-key
  #   availability: [RUNTIME]
  # - variable: AWS_ENDPOINT_URL_S3
  #   secret: portal-s3-endpoint
  #   availability: [RUNTIME]
  # - variable: AWS_REGION
  #   value: ap-southeast-1
  #   availability: [RUNTIME]

  # TESTING ONLY, until the event: lets the Test plan's test clock pretend a
  # session is on (the ?now= part of an address). Remove these three lines
  # before 14 December and roll out; the Ready check warns while it is on.
  - variable: ALLOW_TIME_OVERRIDE
    value: 'true'
    availability: [RUNTIME]

  # The secretariat PIN for /admin.
  - variable: ADMIN_PIN
    secret: portal-admin-pin
    availability: [RUNTIME]

  # Scheduled reminders (Announce page). Cloud Scheduler calls
  # POST /api/cron/reminders every minute with this secret. Create the secret
  # and the scheduler job as in docs/DEPLOYING.md, then remove the # here.
  # - variable: CRON_SECRET
  #   secret: portal-cron-secret
  #   availability: [RUNTIME]

  # The event code. Only people with it can open the portal.
  - variable: EVENT_PASS
    secret: portal-event-pass
    availability: [RUNTIME]

  # The address Firebase gave the portal. Every QR code points here.
  - variable: PORTAL_URL
    value: https://portal--powersummit-7d255.asia-southeast1.hosted.app
    availability: [RUNTIME]
