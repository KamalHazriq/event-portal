# Firebase App Hosting settings for the hosted portal.
# Step by step setup: docs/DEPLOYING.md.
#
# Nothing secret is written here. The secrets are stored in Google Cloud
# Secret Manager and only their names appear below. Their values come from
# Neon: run `neon env pull` on your computer (see docs/DEPLOYING.md).

runConfig:
  # 0 costs nothing when idle, but the first visitor after a quiet spell
  # waits a few seconds. Set it to 1 for the three event days, then back.
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # The hosted store: Postgres (a free Neon database).
  - variable: DATA_ADAPTER
    value: postgres
    availability: [RUNTIME]

  - variable: EVENT_CONFIG_PATH
    value: config/event.json
    availability: [RUNTIME]

  # Neon Postgres. The pooled string for the app's queries, and the direct
  # one for creating the tables on first start.
  - variable: DATABASE_URL
    secret: portal-database-url
    availability: [RUNTIME]
  - variable: DATABASE_URL_UNPOOLED
    secret: portal-database-url-unpooled
    availability: [RUNTIME]

  # Neon Object Storage, for the photo wall. The bucket ("assets") is
  # declared in neon.ts. The endpoint is kept as a secret only because it
  # names the branch; the region is the project's (Singapore).
  - variable: AWS_ACCESS_KEY_ID
    secret: portal-s3-access-key-id
    availability: [RUNTIME]
  - variable: AWS_SECRET_ACCESS_KEY
    secret: portal-s3-secret-access-key
    availability: [RUNTIME]
  - variable: AWS_ENDPOINT_URL_S3
    secret: portal-s3-endpoint
    availability: [RUNTIME]
  - variable: AWS_REGION
    value: ap-southeast-1
    availability: [RUNTIME]

  # The secretariat PIN for /admin.
  - variable: ADMIN_PIN
    secret: portal-admin-pin
    availability: [RUNTIME]

  # The event code. Only people with it can open the portal.
  - variable: EVENT_PASS
    secret: portal-event-pass
    availability: [RUNTIME]

  # The address Firebase gives the portal (or your own domain). Every QR code
  # points here, so set it before printing anything. Uncomment and fill in:
  # - variable: PORTAL_URL
  #   value: https://your-backend--your-project.asia-southeast1.hosted.app
  #   availability: [RUNTIME]
